version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: simple-blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simple_blog_v2
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blogpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: simple-blog-app
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bloguser
      DB_PASSWORD: blogpassword
      DB_NAME: simple_blog_v2
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRY: 24h
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  blog-network:
    driver: bridge
