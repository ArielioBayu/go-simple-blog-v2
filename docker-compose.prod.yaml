services:
  mysql_db:
    image: mysql:8.0
    container_name: simple_blog_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-db-simple-blog}
      MYSQL_USER: ${DB_USER:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-blog_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog_network
    command: --default-authentication-plugin=mysql_native_password

  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: always
    depends_on:
      - mysql_db
    ports:
      - "127.0.0.1:9888:9888"
    volumes:
      - ./internal/configs/config.yaml:/app/internal/configs/config.yaml:ro
      - uploads_data:/app/uploads
    networks:
      - blog_network

volumes:
  mysql_data:
  uploads_data:

networks:
  blog_network:
    driver: bridge
